<script>
(function () {
  var MIN = 140, MAX = 2000, tries = 0;
  function walk(v, out) {
    out.push(v);
    for (const c of (v.child_views || [])) { walk(c, out); }
    return out;
  }
  function wire(bar, panel) {
    const el = bar.el;
    let y0 = 0, h0 = 0, live = false;
    el.addEventListener("pointerdown", function (ev) {
      live = true; y0 = ev.clientY; h0 = panel.height;
      el.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    // One relayout per frame, not one per pointermove: a move event can
    // arrive per mouse poll, and each assignment re-lays-out a canvas holding
    // thousands of points. Coalescing is the difference between a drag that
    // tracks the pointer and one that stutters behind it.
    let want = null, queued = false;
    function flush() {
      queued = false;
      if (want !== null && want !== panel.height) { panel.height = want; }
    }
    el.addEventListener("pointermove", function (ev) {
      if (!live) { return; }
      const lo = panel.min_height || MIN;
      want = Math.max(lo, Math.min(MAX, Math.round(h0 + ev.clientY - y0)));
      if (!queued) { queued = true; window.requestAnimationFrame(flush); }
    });
    function stop(ev) {
      if (!live) { return; }
      live = false;
      // Land the last position now rather than waiting for a frame that may
      // never come: a drag can end inside the same frame it started in, and
      // an inactive tab does not run requestAnimationFrame at all.
      flush();
      try { el.releasePointerCapture(ev.pointerId); } catch (e) {}
    }
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointercancel", stop);
  }
  function arm() {
    const docs = (window.Bokeh && window.Bokeh.documents) || [];
    if (!docs.length || !Bokeh.index || !Bokeh.index.roots.length) {
      // 400 x 50 ms is 20 s, far past any render; a page with no roots is a
      // page with nothing to wire.
      if (++tries < 400) { window.setTimeout(arm, 50); }
      return;
    }
    const doc = docs[0];
    for (const root of Bokeh.index.roots) {
      for (const v of walk(root, [])) {
        const nm = v.model && v.model.name;
        if (!nm || nm.indexOf("rsz-") !== 0 || !v.el) { continue; }
        const panel = doc.get_model_by_name(nm.slice(4));
        if (panel) { wire(v, panel); }
      }
    }
  }
  arm();
})();

ype","@typ"],["city calls it","@typraw"],["chainage","@ch{0.0} m"],["grate","@gy{0.00} m  (@gsrc)"],["survey said","@gsurv{0.00} m"],["invert","@iv{0.00} m"],["offset","@off{0.0} m"],["lat, lon","@lat{0.000000}, @lon{0.000000}"]],"sort_by":null,"attachment":"right"}},{"type":"object","name":"HoverTool","id":"p20215","attributes":{"renderers":[{"id":"p20099"}],"callback":{"type":"object","name":"CustomJS","id":"p20211","attributes":{"args":{"type":"map","entries":[["SRC",{"id":"p20048"}],["cur",{"id":"p20051"}],["vline",{"type":"object","name":"Span","id":"p20108","attributes":{"location":0.0,"dimension":"height","line_color":"#e00000","line_width":1.2,"line_dash":[6]}}],["read",{"id":"p20210"}]]},"code":"\n        // Point glyphs report hits in .indices; LINE glyphs use .line_indices.\n        // The profile hovers a line, the map hovers a scatter, so accept both.\n        const ix = cb_data.index;\n        let i = -1;\n        if (ix.indices &amp;&amp; ix.indices.length) { i = ix.indices[0]; }\n        else if (ix.line_indices &amp;&amp; ix.line_indices.length) { i = ix.line_indices[0]; }\n        if (i &lt; 0) { return; }\n        const H = SRC.data;\n        cur.data = {d:[H.d[i]], z:[H.z[i]], mx:[H.mx[i]], my:[H.my[i]]};\n        cur.change.emit();\n        vline.location = H.d[i];\n        const R = 6378137.0, DEG = 180 / Math.PI;\n        const la = (2 * Math.atan(Math.exp(H.my[i] / R)) - Math.PI / 2) * DEG;\n        const lo = H.mx[i] / R * DEG;\n        read.text = \"&lt;b&gt;\" + H.d[i].toFixed(0) + \" m&lt;/b&gt; along  |  elev &lt;b&gt;\"\n                  + H.z[i].toFixed(2) + \" m&lt;/b&gt;  |  smoothed \" + H.sm[i].toFixed(2)\n                  + \" m  |  &lt;b&gt;\" + la.toFixed(6) + \", \" + lo.toFixed(6) + \"&lt;/b&gt;\";\n    "}},"tooltips":[["chainage","@d{0.0} m"],["elev","@z{0.00} m"],["smoothed (10 m)","@sm{0.00} m"],["lat, lon","@my{custom}, @mx{custom}"]],"formatters":{"type":"map","entries":[["@my",{"type":"object","name":"CustomJSHover","i
