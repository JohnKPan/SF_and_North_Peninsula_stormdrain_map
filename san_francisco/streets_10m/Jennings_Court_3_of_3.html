<script>
(function () {
  var MIN = 140, MAX = 2000, tries = 0;
  function walk(v, out) {
    out.push(v);
    for (const c of (v.child_views || [])) { walk(c, out); }
    return out;
  }
  function wire(bar, panel) {
    const el = bar.el;
    let y0 = 0, h0 = 0, live = false;
    el.addEventListener("pointerdown", function (ev) {
      live = true; y0 = ev.clientY; h0 = panel.height;
      el.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    // One relayout per frame, not one per pointermove: a move event can
    // arrive per mouse poll, and each assignment re-lays-out a canvas holding
    // thousands of points. Coalescing is the difference between a drag that
    // tracks the pointer and one that stutters behind it.
    let want = null, queued = false;
    function flush() {
      queued = false;
      if (want !== null && want !== panel.height) { panel.height = want; }
    }
    el.addEventListener("pointermove", function (ev) {
      if (!live) { return; }
      const lo = panel.min_height || MIN;
      want = Math.max(lo, Math.min(MAX, Math.round(h0 + ev.clientY - y0)));
      if (!queued) { queued = true; window.requestAnimationFrame(flush); }
    });
    function stop(ev) {
      if (!live) { return; }
      live = false;
      // Land the last position now rather than waiting for a frame that may
      // never come: a drag can end inside the same frame it started in, and
      // an inactive tab does not run requestAnimationFrame at all.
      flush();
      try { el.releasePointerCapture(ev.pointerId); } catch (e) {}

    el.addEventListener("pointerup", stop);
    el.addEventListener("pointercancel", stop);
  }

    const docs = (window.Bokeh && window.Bokeh.documents) || [];

      return;

    }

igure covers every inlet type, so find which\n            // source actually took the hit. Tapping empty space clears them\n            // all and we return, leaving the last pick pinned.\n            let D = null, i = -1;\n            for (const s of S) {\n                const sel = s.selected.indices;\n                if (sel &amp;&amp; sel.length) { D = s.data; i = sel[0]; break; }\n            }\n            if (D === null) { return; }\n            const la = D.lat[i], lo = D.lon[i];\n            const url = \"https://www.google.com/maps/@?api=1\"\n                      + \"&amp;map_action=pano&amp;viewpoint=\" + la.toFixed(6) + \",\"\n                      + lo.toFixed(6) + \"&amp;heading=\" + D.hd[i].toFixed(0);\n            const iv = isFinite(D.iv[i]) ? D.iv[i].toFixed(2) + \" m\" : \"n/a\";\n            // An inlet whose publisher gave it no id has nothing to show\n            // here. Drop the field AND its separator, rather than leaving a\n            // dangling \" . . \" or printing \"nan\". The NaN test is aid !== aid\n            // because a page built before this fix carries a real NaN here.\n            const aid = D.asset[i];\n            const idtxt = (aid === null || aid === undefined || aid === \"\"\n                           || aid !== aid) ? \"\" : \" &amp;middot; \" + aid;\n            // The canonical class folds five cities' vocabularies together, so\n            // show the publisher's own wording alongside it -- but only when it\n            // actually differs, or every Livermore inlet would say the same\n            // thing twice.\n            const raw = (D.typraw &amp;&amp; D.typraw[i]) ? D.typraw[i] : \"\";\n            const typ = (raw &amp;&amp; raw !== D.typ[i])\n                        ? D.typ[i] + \" &lt;span style='color:#777'&gt;(\" + raw + \")&lt;/span&gt;\"\n                        : D.typ[i];\n            pick.text =\n                \"&lt;b&gt;inlet #\" + D.num[i] + \"&lt;/b&gt;\" + idtxt\n              + \" &amp;middo
