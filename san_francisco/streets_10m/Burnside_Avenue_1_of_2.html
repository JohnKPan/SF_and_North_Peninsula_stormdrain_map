(function () {

    let y0 = 0, h0 = 0, live = false;

    // arrive per mouse poll, and each assignment re-lays-out a canvas holding
    // thousands of points. Coalescing is the difference between a drag that

    let want = null, queued = false;

txt\n              + \" &amp;middot; \" + typ + \" &amp;middot; \" + D.ch[i].toFixed(1)\n              + \" m along &amp;middot; grate \" + D.gy[i].toFixed(2) + \" m \"\n              + (D.gsrc[i] === \"survey\"\n                 ? \"&lt;span style='color:#2e7d32'&gt;(surveyed)&lt;/span&gt;\"\n                 : \"&lt;span style='color:#c0392b'&gt;(from DEM, not surveyed\"\n                   + (isFinite(D.gsurv[i])\n                      ? \"; survey said \" + D.gsurv[i].toFixed(2) + \" m\" : \"\")\n                   + \")&lt;/span&gt;\")\n              + \" &amp;middot; invert \" + iv + \" &amp;middot; \" + D.off[i].toFixed(1)\n              + \" m off centerline&lt;br&gt;\" + la.toFixed(6) + \", \" + lo.toFixed(6)\n              + \" &amp;nbsp;&amp;rarr;&amp;nbsp; &lt;a href='\" + url + \"' target='_blank'\"\n              + \" rel='noopener'&gt;open Street View&lt;/a&gt;\"\n              + \" &lt;span style='color:#777'&gt;(facing the inlet from the road)\"\n              + \"&lt;/span&gt;\";\n        "}}}}],"active_tap":{"id":"p24171"}}},"left":[{"type":"object","name":"LinearAxis","id":"p23998","attributes":{"ticker":{"type":"object","name":"BasicTicker","id":"p23999","attributes":{"mantissas":[1,2,5]}},"formatter":{"type":"object","name":"BasicTickFormatter","id":"p24000"},"axis_label":"elevation (m, NAVD88)","major_label_policy":{"type":"object","name":"AllLabels","id":"p24001"}}}],"above":[{"type":"object","name":"Title","id":"p24014","attributes":{"text":"Elevation is bare-earth ground, not the road surface -- a bridge deck is not in the DEM, so a crossing reads as a dip, and a sag found on one is the surface rather than a place water collects. Bridge spans are drawn in purple, tunnels in green.","text_color":"#52514e","text_font_style":"normal"}}],"below":[{"type":"object","name":"LinearAxis","id":"p23993","attributes":{"ticker":{"type":"object","name":"BasicTicker","id":"p23994","attributes":{"mantissas":[1,2,5]}},"formatter":{"type":"object","name":"Ba
